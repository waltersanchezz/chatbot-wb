name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production sprints 1–3
        run: |
          npm run test:production-sprint1
          npm run test:production-sprint2
          npm run test:production-sprint3

      - name: Production sprint 4
        run: npm run test:production-sprint4

      - name: Willard + CRM regression
        run: npx vitest run tests/willard tests/crm

      - name: Build backend
        run: npm run build

      - name: Build operator dashboard
        run: npm run dashboard:build
