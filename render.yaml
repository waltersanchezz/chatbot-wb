services:
  - type: web
    name: rodacenter-ai
    runtime: node
    plan: free
    region: oregon
    # All packages required by `tsc` (typescript, @types/*) live in dependencies.
    # Use omit=dev so NODE_ENV=production cannot skip @types/node.
    # Explicit reinstall of @types/node guards against lockfile/hoist edge cases on Render.
    buildCommand: npm ci --omit=dev && npm install @types/node@24.13.3 --no-save && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: Rodacenter AI
      - key: COMPANY_NAME
        value: Rodacenter Manizales
      - key: AI_PROVIDER
        value: rule-based
      - key: LOG_LEVEL
        value: info
      - key: LOG_DIR
        value: logs
      - key: SESSION_TTL_MINUTES
        value: "120"
      - key: WHATSAPP_API_VERSION
        value: v21.0
      # Configurar en el dashboard de Render (no commitear secretos):
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
