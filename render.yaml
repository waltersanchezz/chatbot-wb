services:
  - type: web
    name: rodacenter-ai
    runtime: node
    # Free no soporta Persistent Disk. Starter (o superior) es obligatorio para SQLite/idempotencia.
    plan: starter
    region: oregon
    # Root + dashboard: include build toolchain (tsc/vite). Dashboard build deps live in
    # apps/dashboard dependencies so nested `npm ci` also works with NODE_ENV=production.
    # Backend + panel Vite del operador (apps/dashboard/dist → /dashboard).
    buildCommand: npm ci --include=dev && npm run build && npm run dashboard:build
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: rodacenter-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: Rodacenter AI
      - key: COMPANY_NAME
        value: Rodacenter Manizales
      - key: AI_PROVIDER
        value: rule-based
      - key: LOG_LEVEL
        value: info
      - key: DATA_DIR
        value: /var/data
      - key: SQLITE_PATH
        value: /var/data/rodacenter.sqlite
      - key: LOG_DIR
        value: /var/data/logs
      - key: WHATSAPP_IDEMPOTENCY_PATH
        value: /var/data/whatsapp-processed-wamids.json
      - key: SESSION_TTL_MINUTES
        value: "120"
      - key: AUTH_REQUIRED
        value: "true"
      - key: WHATSAPP_API_VERSION
        value: v21.0
      # Secretos — configurar en el dashboard de Render (sync: false).
      # Fail-fast al arrancar si faltan o son defaults inseguros (Production Sprint 1).
      - key: JWT_SECRET
        sync: false
      - key: AUTH_ADMIN_EMAIL
        sync: false
      - key: AUTH_ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
